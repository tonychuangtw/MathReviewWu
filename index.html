<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<title>國中數學總複習 — 重點整理</title>
<link rel="stylesheet" href="js/vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1 id="homeLink">國中數學總複習</h1>
  <div class="topbar-controls">
    <button id="themeBtn" class="chip" title="選擇色系">🎨</button>
    <button id="progressBtn" class="chip" title="學習進度總覽">📊</button>
  </div>
</header>

<main id="main">

<!-- 首頁：冊選擇 + 單元列表 -->
<section id="view-home" class="view">
  <div id="bookTabs" class="book-tabs"></div>
  <div id="unitList" class="unit-list"></div>
</section>

<!-- 單元頁 -->
<section id="view-unit" class="view hidden">
  <div class="unit-head">
    <button id="backBtn" class="chip">← 返回</button>
    <div class="unit-title-wrap">
      <div id="unitCrumb" class="unit-crumb"></div>
      <h2 id="unitTitle"></h2>
    </div>
    <div id="statusBtns" class="status-btns"></div>
  </div>
  <div id="conceptList"></div>
  <div class="unit-nav">
    <button id="prevUnit" class="chip">← 上一單元</button>
    <button id="nextUnit" class="chip">下一單元 →</button>
  </div>
  <button id="olBtn" class="ol-btn" title="直接寫在重點上">✍️</button>
</section>

<!-- 進度總覽 -->
<section id="view-progress" class="view hidden">
  <div class="unit-head">
    <button id="backBtn2" class="chip">← 返回</button>
    <h2>學習進度總覽</h2>
  </div>
  <div id="progressGrid"></div>
</section>

</main>

<footer class="foot"><small>內容整理自吳老師家教講義 · 僅供個人學習使用</small></footer>

<script src="js/vendor/katex/katex.min.js"></script>
<script src="js/vendor/katex/auto-render.min.js"></script>
<script src="js/data/units.js"></script>
<script src="js/app.js"></script>
<script src="js/sync.js"></script>
</body>
</html>
